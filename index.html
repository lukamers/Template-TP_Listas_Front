<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="filtros">
      <input type="search" id="buscador" placeholder="Busca por nombre, provincia o categoria" class="recbusqueda">
    
      <select class="filtro" id="filtroCategoria">
        <option value="">Todas las categorías</option>
        <option value="Parrilla">Parrilla</option>
        <option value="Horno">Horno</option>
        <option value="Guiso">Guiso</option>
        <option value="Frito">Frito</option>
      </select>
      <select class="filtro" id="filtroProvincia">
        <option value="">Todas las provincias</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Tucumán">Tucumán</option>
        <option value="Jujuy">Jujuy</option>
        <option value="Córdoba">Córdoba</option>
        <option value="Salta">Salta</option>
        <option value="Santa Fe">Santa Fe</option>
        <option value="Entre Rí os">Entre Ríos</option>
      </select>
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <article class="addFood">
      <form id="agregarComidaForm">
        <h2>Agregar comida</h2>
        <label for="nombre">Nombre de la comida</label>
        <input id="nombre" placeholder="Nombre de la comida" required>

        <label for="provincia">Provincia</label>
        <input type="text" id="provincia" placeholder="provincia" required>

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" placeholder="categoria" required>
        
        <label for="ingredientes">Ingredientes</label>
        <input type="text" id="ingredientes" placeholder="Ingredientes (separados por comas)" required>


        <button type="submit">Agregar</button>

      </form>
    </article>

    <section class="addFood">
      <!-- Para el form para agregar comida -->
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
